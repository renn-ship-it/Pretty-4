<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Match 🎀</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff0f6;color:#74445c;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.app{width:min(100%,430px);background:#fff;border-radius:26px;padding:22px 18px;box-shadow:0 12px 35px #e8b8cc88;text-align:center}
h1{margin:0;font-size:27px}.sub{margin:6px 0 16px;color:#a4778e;font-size:14px}
.stats{display:flex;justify-content:space-around;background:#fff0f6;border-radius:15px;padding:11px;margin-bottom:15px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:340px;margin:auto}
.tile{aspect-ratio:1;border:0;border-radius:15px;background:#ffdce9;box-shadow:inset 0 -4px #f4bfd4;font-size:clamp(27px,8vw,39px);cursor:pointer;transition:transform .12s,background .12s}
.tile:active{transform:scale(.94)}.tile.open,.tile.matched{background:#fff5f9;box-shadow:inset 0 0 0 2px #f5c4d8}.tile.matched{opacity:.55}
.actions{display:flex;gap:9px;justify-content:center;margin-top:17px}button.action{border:0;border-radius:22px;padding:11px 20px;background:#f58ab5;color:white;font-weight:700;font-size:14px;cursor:pointer}.action.secondary{background:#f4e1ea;color:#87546d}
#notice{min-height:24px;margin-top:12px;font-size:13px;color:#a05c7d}
.overlay{position:fixed;inset:0;background:#693b5666;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:white;border-radius:24px;padding:25px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 35px #63334b55}
.modal .emoji{font-size:55px}.modal h2{margin:8px 0}.modal p{color:#966b80;font-size:14px;line-height:1.5}
@media(max-width:360px){.board{gap:6px}.tile{border-radius:11px}}
</style>
</head>
<body>
<main class="app">
  <h1>🎀 Sticker Match</h1>
  <p class="sub">Cari dan cocokkan pasangan stiker yang sama!</p>
  <div class="stats"><span>⭐ Skor: <b id="score">0</b></span><span>⏱️ Waktu: <b id="time">0</b></span><span>👣 Langkah: <b id="moves">0</b></span></div>
  <div class="board" id="board" aria-label="Papan permainan"></div>
  <div class="actions"><button class="action" id="restart">Acak ulang ↻</button><button class="action secondary" id="hint">Petunjuk 💡</button></div>
  <div id="notice">Temukan 8 pasangan stiker. Semangat! 💗</div>
</main>
<div class="overlay" id="overlay">
 <div class="modal"><div class="emoji">🐰💗</div><h2>Sticker Match!</h2><p>Balik dua kartu dan temukan pasangan stiker yang sama. Selesaikan secepat mungkin!</p><button class="action" id="start">Main sekarang!</button></div>
</div>
<script>
const icons=['🐰','🐻','🐱','🐸','🐼','🐣','🍓','🌷'];
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),movesEl=document.getElementById('moves'),notice=document.getElementById('notice'),overlay=document.getElementById('overlay');
let deck=[],first=null,lock=false,matched=0,score=0,moves=0,seconds=0,timer=null,active=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setup(){clearInterval(timer);deck=shuffle([...icons,...icons]);first=null;lock=false;matched=0;score=0;moves=0;seconds=0;active=false;update();board.innerHTML='';
 deck.forEach((emoji,i)=>{let b=document.createElement('button');b.className='tile';b.type='button';b.textContent='❔';b.dataset.emoji=emoji;b.dataset.index=i;b.setAttribute('aria-label','Kartu tertutup');b.addEventListener('click',()=>flip(b));board.appendChild(b)});
 notice.textContent='Temukan 8 pasangan stiker. Semangat! 💗';
}
function update(){scoreEl.textContent=score;timeEl.textContent=seconds+' dtk';movesEl.textContent=moves}
function start(){overlay.style.display='none';if(!active){active=true;timer=setInterval(()=>{seconds++;update()},1000)}}
function flip(card){if(!active||lock||card.classList.contains('open')||card.classList.contains('matched'))return;
 card.textContent=card.dataset.emoji;card.classList.add('open');card.setAttribute('aria-label',card.dataset.emoji);
 if(!first){first=card;return}
 moves++;update();
 if(first.dataset.emoji===card.dataset.emoji){first.classList.add('matched');card.classList.add('matched');first.classList.remove('open');card.classList.remove('open');first=null;matched++;score+=10;update();notice.textContent='Yeay, ketemu pasangan! ✨';if(matched===8)win()}
 else{lock=true;score=Math.max(0,score-1);update();notice.textContent='Belum cocok, coba lagi! 😝';let old=first;first=null;setTimeout(()=>{[old,card].forEach(c=>{c.textContent='❔';c.classList.remove('open');c.setAttribute('aria-label','Kartu tertutup')});lock=false},750)}
}
function win(){clearInterval(timer);active=false;overlay.querySelector('.emoji').textContent='🏆🎉';overlay.querySelector('h2').textContent='Kamu menang!';overlay.querySelector('p').textContent=`Semua pasangan ditemukan dalam ${seconds} detik dengan ${moves} langkah. Skor: ${score}!`;overlay.querySelector('button').textContent='Main lagi';overlay.style.display='flex'}
document.getElementById('start').addEventListener('click',()=>{if(matched===8)setup();start()});
document.getElementById('restart').addEventListener('click',()=>{setup();start()});
document.getElementById('hint').addEventListener('click',()=>{if(!active)return;let hidden=[...board.children].filter(c=>!c.classList.contains('matched'));if(hidden.length){let c=hidden[Math.floor(Math.random()*hidden.length)];c.textContent=c.dataset.emoji;c.classList.add('open');setTimeout(()=>{if(!c.classList.contains('matched')){c.textContent='❔';c.classList.remove('open')}},650);notice.textContent='Intip sebentar yaa 👀'}});
setup();
</script>
</body>
</html>
